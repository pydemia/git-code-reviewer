name: git-code-reviewer-dev

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: git_code_reviewer
      POSTGRES_USER: git_code_reviewer
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    ports:
      - '${POSTGRES_PORT:-55432}:5432'
    volumes:
      - git-code-reviewer-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U git_code_reviewer -d git_code_reviewer']
      interval: 2s
      timeout: 3s
      retries: 20

volumes:
  git-code-reviewer-postgres:
