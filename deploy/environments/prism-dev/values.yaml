# PRISM-DEV 검증 전용 profile.
#
# - kube context: PRISM-DEV (~/.kube/config)
# - Kubernetes API: https://10.250.107.193:6443
# - namespace: git-code-reviewer
# - StorageClass: nfs-csi (RWX artifact, RWO PostgreSQL)
# - 접근: pr-review.prism.ai HTTPRoute 또는 kubectl port-forward
# - 인증: Local account, GitHub: fixture 및 등록된 credential, Chat: account registry

image:
  repository: docker.io/pydemia/git-code-reviewer
  tag: '0.8.0-alpha.19'
  digest: ''
  pullPolicy: IfNotPresent

imagePullSecrets: []

chatAgent:
  enabled: true
  allowedUserIds: []
  maxModelCalls: 8
  maxToolCalls: 24
  contextBytes: 131072
  workspaceMaxBytes: 1073741824
  sandboxStorage: 5Gi
modelAdmission:
  enabled: true

publicBaseUrl: http://pr-review.prism.ai

trustedCa:
  existingConfigMap: git-code-reviewer-corporate-ca
  key: ca.crt

server:
  replicas: 1
  ingress:
    enabled: false

worker:
  replicas: 1
  concurrency: 1
  workspace:
    mode: emptyDir
    size: 5Gi
    storageClass: ''

storage:
  backend: pvc
  artifacts:
    existingClaim: ''
    storageClass: nfs-csi
    accessModes: [ReadWriteMany]
    size: 10Gi

database:
  existingSecret: ''

postgresql:
  enabled: true
  architecture: standalone
  image:
    # postgresql chart 18.8.14의 기본값은 latest이므로 PRISM-DEV 검증에서는
    # 현재 linux/amd64 manifest를 고정한다.
    digest: 'sha256:e39896e0b1ba7b0d5b8de7ab8792118eaac3cc27f89659aa9fe2c788b395e204'
  auth:
    username: git_code_reviewer
    database: git_code_reviewer
    existingSecret: git-code-reviewer-postgresql-auth
  primary:
    persistence:
      enabled: true
      storageClass: nfs-csi
      size: 10Gi

keycloak:
  enabled: false

secrets:
  auth: git-code-reviewer-auth
  githubApp: ''
  credentialRegistry: git-code-reviewer-credential-registry
  modelProvider: '' # Batch 분석은 등록된 account registry의 암호화 key를 사용한다.

credentialRegistry:
  enabled: true
  encryptionKeyKey: CREDENTIAL_ENCRYPTION_KEY

github:
  mode: fixture

auth:
  mode: local
  local:
    adminDisplayName: PRISM-DEV 시스템관리자
    reviewerDisplayName: PRISM-DEV 일반사용자
  autoJoinDefaultTenant: true

authorization:
  mode: local

cerbos:
  enabled: false

model:
  analysis:
    mode: disabled
    admin:
      enabled: true
  chat:
    mode: registry

networkPolicy:
  enabled: false

podDisruptionBudget:
  enabled: false
