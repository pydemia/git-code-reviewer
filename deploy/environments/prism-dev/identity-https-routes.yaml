apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: git-code-reviewer-identity-https-route
  namespace: git-code-reviewer
spec:
  parentRefs:
    - name: envoy-gateway
      namespace: envoy-gateway-system
      sectionName: gcr-identity-https
  hostnames: [auth.pr-review.prism.ai]
  rules:
    - matches:
        - path: { type: PathPrefix, value: /realms/git-code-reviewer }
        - path: { type: PathPrefix, value: /resources }
      backendRefs:
        - name: git-code-reviewer-identity
          port: 80
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: git-code-reviewer-https-route
  namespace: git-code-reviewer
spec:
  parentRefs:
    - name: envoy-gateway
      namespace: envoy-gateway-system
      sectionName: gcr-https
  hostnames: [pr-review.prism.ai]
  rules:
    - matches:
        - path: { type: PathPrefix, value: / }
      backendRefs:
        - name: git-code-reviewer
          port: 80
