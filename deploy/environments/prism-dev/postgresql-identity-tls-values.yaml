# Enable server TLS while preserving the existing application's DB role and
# connection mode. The Keycloak role is confined to its own DB and TLS in HBA.
postgresql:
  tls:
    enabled: true
    autoGenerated: false
    certificatesSecret: git-code-reviewer-postgresql-tls
    certFilename: tls.crt
    certKeyFilename: tls.key
    certCAFilename: ''
  volumePermissions:
    image:
      registry: registry-1.docker.io
      repository: bitnami/postgresql
      digest: sha256:e39896e0b1ba7b0d5b8de7ab8792118eaac3cc27f89659aa9fe2c788b395e204
  primary:
    pgHbaConfiguration: |
      hostssl git_code_reviewer_keycloak gcr_keycloak 0.0.0.0/0 scram-sha-256
      hostssl git_code_reviewer_keycloak gcr_keycloak ::/0 scram-sha-256
      host all gcr_keycloak 0.0.0.0/0 reject
      host all gcr_keycloak ::/0 reject
      local all gcr_keycloak reject
      host all all 0.0.0.0/0 md5
      host all all ::/0 md5
      local all all md5
      host all all 127.0.0.1/32 md5
      host all all ::1/128 md5
