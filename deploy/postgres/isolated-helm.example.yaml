# Role provisioning, database TLS and the referenced Secrets/ConfigMap must be
# ready before upgrading the application. See docs/operations/shared-postgresql.md.
# This overlay is not a complete environment configuration.
database:
  tls:
    mode: verify-full
    existingConfigMap: git-code-reviewer-postgresql-ca
    key: ca.crt
  isolated:
    enabled: true
    host: '' # Uses the bundled PostgreSQL service name; include it in the cert SAN.
    name: git_code_reviewer
    runtimeSecret: git-code-reviewer-db-app
    migratorSecret: git-code-reviewer-db-migrator
    passwordKey: password
    budget:
      serverPeakReplicas: 2
      workerPeakReplicas: 2
      applicationConnectionLimit: 42
      migratorConnectionLimit: 2
      keycloakConnectionLimit: 30
      maxConnections: 100
      reservedConnections: 3
      otherConnections: 5
      operatorReserve: 10
server:
  replicas: 1
  databasePoolMax: 10
worker:
  replicas: 1
  databasePoolMax: 10
postgresql:
  enabled: true
  # Keep existing bootstrap settings and PVC. These are not application logins.
  auth:
    username: git_code_reviewer
    database: git_code_reviewer
    existingSecret: git-code-reviewer-postgresql-auth
  tls:
    enabled: true
    autoGenerated: false
    certificatesSecret: git-code-reviewer-postgresql-tls
    certFilename: tls.crt
    certKeyFilename: tls.key
    certCAFilename: '' # Client CA trust is mounted by the application separately.
  primary:
    pgHbaConfiguration: |
      local all all trust
      hostssl all all 0.0.0.0/0 scram-sha-256
      hostssl all all ::0/0 scram-sha-256
      hostnossl all all 0.0.0.0/0 reject
      hostnossl all all ::0/0 reject
keycloak:
  enabled: false
