apiVersion: v1
kind: Service
metadata:
  name: {{ include "gcr-identity.fullname" . }}
  labels:
    {{- include "gcr-identity.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "gcr-identity.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: 80
      targetPort: http
      appProtocol: http
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "gcr-identity.fullname" . }}-admin
  labels:
    {{- include "gcr-identity.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "gcr-identity.selectorLabels" . | nindent 4 }}
  ports:
    - name: https
      port: 443
      targetPort: https
      appProtocol: https
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "gcr-identity.fullname" . }}-management
  labels:
    {{- include "gcr-identity.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "gcr-identity.selectorLabels" . | nindent 4 }}
  ports:
    - name: management
      port: 9000
      targetPort: management
      appProtocol: http
