apiVersion: api.cerbos.dev/v1
resourcePolicy:
  resource: tenant
  version: default
  rules:
    - actions: ['*']
      effect: EFFECT_ALLOW
      roles: ['administrator']
      condition:
        match:
          expr: request.principal.attr.enabled == true
    - actions: ['view']
      effect: EFFECT_ALLOW
      roles: ['reviewer']
      condition:
        match:
          expr: request.principal.attr.enabled == true && request.resource.attr.enabled == true && request.resource.attr.tenantId in request.principal.attr.tenantIds
