image:
  repository: docker.io/pydemia/git-code-reviewer
  tag: '0.2.0-alpha.1'
  digest: ''
  pullPolicy: IfNotPresent

# Required when the Docker Hub repository is private. Create this Secret in
# the release namespace with a Docker Hub access token.
imagePullSecrets:
  - name: dockerhub-registry

publicBaseUrl: https://git-code-reviewer.example.internal

server:
  replicas: 2
  ingress:
    enabled: true
    className: nginx
    host: git-code-reviewer.example.internal
    path: /
    annotations:
      nginx.ingress.kubernetes.io/proxy-buffering: 'off'
      nginx.ingress.kubernetes.io/proxy-read-timeout: '3600'
    tlsSecretName: git-code-reviewer-tls

worker:
  replicas: 2
  concurrency: 2
  workspace:
    mode: emptyDir
    size: 10Gi
    storageClass: ''

storage:
  backend: pvc
  artifacts:
    existingClaim: ''
    storageClass: rwx-storage
    accessModes: [ReadWriteMany]
    size: 100Gi

database:
  existingSecret: git-code-reviewer-db
  urlKey: DATABASE_URL

# Keep disabled for an externally operated production database. For a
# self-contained pilot, enable this block and omit the external DB Secret.
postgresql:
  enabled: false
  auth:
    username: git_code_reviewer
    database: git_code_reviewer
    existingSecret: ''
  primary:
    persistence:
      enabled: true
      storageClass: block-storage
      size: 20Gi

secrets:
  githubApp: git-code-reviewer-github-app
  auth: git-code-reviewer-auth
  modelProvider: git-code-reviewer-model
  chatModelProvider: git-code-reviewer-chat-model

github:
  mode: app

auth:
  mode: oidc

model:
  analysis:
    mode: disabled
    endpoint: ''
    name: ''
    apiKeyKey: API_KEY
    timeoutMs: 120000
  chat:
    mode: disabled
    endpoint: ''
    name: ''
    apiKeyKey: API_KEY
    timeoutMs: 60000
    concurrencyLimit: 2
    hourlyLimit: 30
    sessionMessageLimit: 200

trustedCa:
  existingConfigMap: corporate-ca
  key: ca.crt

retention:
  enabled: true
  schedule: '*/10 * * * *'
  reportDays: 90
  chatDays: 30
  eventLogHours: 24
  orphanGraceHours: 24
  deleteGraceHours: 1
  batchSize: 500

# Enable only after adding cluster-specific DB, GHES, OIDC, and model CIDRs.
networkPolicy:
  enabled: false
  serverIngressFrom: []
  # Each entry is a Kubernetes NetworkPolicyPeer/port rule. Replace these
  # documentation ranges with the cluster's PostgreSQL and HTTPS CIDRs.
  # additionalEgress:
  #   - to:
  #       - ipBlock: { cidr: 192.0.2.10/32 }
  #     ports:
  #       - { protocol: TCP, port: 5432 }
  #   - to:
  #       - ipBlock: { cidr: 198.51.100.0/24 }
  #     ports:
  #       - { protocol: TCP, port: 443 }
  additionalEgress: []
