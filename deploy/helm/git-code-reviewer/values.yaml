image:
  repository: docker.io/pydemia/git-code-reviewer
  tag: '0.6.0-alpha.1'
  digest: ''
  pullPolicy: IfNotPresent
imagePullSecrets: []
publicBaseUrl: https://git-code-reviewer.example.internal
trustedCa:
  existingConfigMap: ''
  key: ca.crt

server:
  replicas: 2
  port: 4000
  databasePoolMax: 10
  ingress:
    enabled: false
    className: ''
    host: git-code-reviewer.example.internal
    path: /
    annotations: {}
    tlsSecretName: ''
  resources:
    requests: { cpu: 100m, memory: 192Mi }
    limits: { cpu: '1', memory: 1Gi }

worker:
  replicas: 2
  concurrency: 2
  healthPort: 4001
  terminationGracePeriodSeconds: 900
  workspace:
    mode: emptyDir
    size: 10Gi
    storageClass: ''
  resources:
    requests: { cpu: 250m, memory: 512Mi }
    limits: { cpu: '2', memory: 4Gi }

storage:
  backend: pvc
  artifacts:
    existingClaim: ''
    storageClass: ''
    accessModes: [ReadWriteMany]
    size: 100Gi

database:
  existingSecret: git-code-reviewer-db
  urlKey: DATABASE_URL

# Disabled by default for production installations that use a managed database.
# When enabled, this dependency replaces database.existingSecret.
postgresql:
  enabled: false
  architecture: standalone
  fullnameOverride: ''
  auth:
    username: git_code_reviewer
    database: git_code_reviewer
    password: ''
    existingSecret: ''
    secretKeys:
      userPasswordKey: password
      adminPasswordKey: postgres-password
  primary:
    service:
      ports:
        postgresql: 5432
    persistence:
      enabled: true
      storageClass: ''
      size: 20Gi
    networkPolicy:
      enabled: true
      allowExternal: true
  metrics:
    enabled: false

secrets:
  githubApp: git-code-reviewer-github-app
  auth: git-code-reviewer-auth
  modelProvider: git-code-reviewer-model
  chatModelProvider: git-code-reviewer-chat-model
  chatgptAccount: git-code-reviewer-chatgpt-account

github:
  mode: app
  appIdKey: APP_ID
  privateKeyKey: PRIVATE_KEY

auth:
  mode: oidc
  proxyPublicKeyKey: PROXY_IDENTITY_PUBLIC_KEY
  adminRole: git-code-reviewer-admin
  adminGroup: git-code-reviewer-admins
  defaultTenantSlug: default
  autoJoinDefaultTenant: false

authorization:
  mode: local
  cerbosUrl: ''
  timeoutMs: 2000

cerbos:
  enabled: false
  replicas: 2
  port: 3592
  image:
    repository: ghcr.io/cerbos/cerbos
    tag: 0.55.0
    pullPolicy: IfNotPresent
  resources:
    requests: { cpu: 50m, memory: 64Mi }
    limits: { cpu: 500m, memory: 256Mi }

model:
  analysis:
    mode: disabled
    endpoint: ''
    name: ''
    apiKeyKey: API_KEY
    timeoutMs: 120000
    admin:
      enabled: false
      encryptionKeyKey: SETTINGS_ENCRYPTION_KEY
      allowedOrigins: []
  chat:
    mode: disabled
    endpoint: ''
    name: ''
    apiKeyKey: API_KEY
    timeoutMs: 60000
    concurrencyLimit: 2
    hourlyLimit: 30
    sessionMessageLimit: 200
    account:
      authFileKey: auth.json
      bootstrapRevision: initial
      home: /var/lib/git-code-reviewer/chatgpt-account
      refreshEndpoint: https://auth.openai.com/oauth/token
      proactiveRefreshMinutes: 5
      persistence:
        existingClaim: ''
        storageClass: ''
        accessModes: [ReadWriteMany]
        size: 1Gi

retention:
  enabled: true
  schedule: '*/10 * * * *'
  reportDays: 90
  chatDays: 30
  eventLogHours: 24
  orphanGraceHours: 24
  deleteGraceHours: 1
  batchSize: 500

serviceAccount:
  create: true
  name: ''

networkPolicy:
  enabled: false
  serverIngressFrom: []
  additionalEgress: []

podDisruptionBudget:
  enabled: true
