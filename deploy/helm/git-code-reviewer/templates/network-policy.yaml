{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "git-code-reviewer.fullname" . }}-default-deny
  labels:
    {{- include "git-code-reviewer.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "git-code-reviewer.selectorLabels" . | nindent 6 }}
  policyTypes: [Ingress, Egress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "git-code-reviewer.fullname" . }}-server-ingress
  labels:
    {{- include "git-code-reviewer.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "git-code-reviewer.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: server
  policyTypes: [Ingress]
  ingress:
    - {{- with .Values.networkPolicy.serverIngressFrom }}
      from: {{ toYaml . | nindent 8 }}
      {{- end }}
      ports:
        - { protocol: TCP, port: {{ .Values.server.port }} }
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "git-code-reviewer.fullname" . }}-egress
  labels:
    {{- include "git-code-reviewer.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "git-code-reviewer.selectorLabels" . | nindent 6 }}
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - { protocol: UDP, port: 53 }
        - { protocol: TCP, port: 53 }
    {{- with .Values.networkPolicy.additionalEgress }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
{{- end }}
