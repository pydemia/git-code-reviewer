apiVersion: v1
kind: Service
metadata:
  name: {{ include "git-code-reviewer.fullname" . }}
  labels:
    {{- include "git-code-reviewer.labels" . | nindent 4 }}
spec:
  selector:
    {{- include "git-code-reviewer.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: server
  ports:
    - name: http
      port: 80
      targetPort: http

