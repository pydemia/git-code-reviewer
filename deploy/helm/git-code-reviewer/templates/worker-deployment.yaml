apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "git-code-reviewer.fullname" . }}-worker
  labels:
    {{- include "git-code-reviewer.labels" . | nindent 4 }}
    app.kubernetes.io/component: worker
spec:
  replicas: {{ .Values.worker.replicas }}
  selector:
    matchLabels:
      {{- include "git-code-reviewer.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: worker
  template:
    metadata:
      labels:
        {{- include "git-code-reviewer.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: worker
    spec:
      serviceAccountName: {{ include "git-code-reviewer.serviceAccountName" . }}
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: {{ .Values.worker.terminationGracePeriodSeconds }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets: {{ toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile: { type: RuntimeDefault }
      {{- if .Values.postgresql.enabled }}
      initContainers:
        {{- include "git-code-reviewer.migrationInitContainer" . | nindent 8 }}
      {{- end }}
      containers:
        - name: worker
          image: {{ include "git-code-reviewer.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["worker"]
          envFrom:
            - configMapRef: { name: {{ include "git-code-reviewer.fullname" . }} }
          env:
            {{- include "git-code-reviewer.databaseEnv" . | nindent 12 }}
            {{- if eq .Values.github.mode "app" }}
            - name: GITHUB_APP_ID
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.githubApp }}
                  key: {{ .Values.github.appIdKey }}
            - name: GITHUB_PRIVATE_KEY_FILE
              value: /run/secrets/github-app/private-key.pem
            {{- end }}
            {{- if eq .Values.model.analysis.mode "openai-compatible" }}
            - name: MODEL_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.modelProvider }}
                  key: {{ .Values.model.analysis.apiKeyKey }}
            {{- end }}
            {{- if .Values.trustedCa.existingConfigMap }}
            - name: NODE_EXTRA_CA_CERTS
              value: /run/config/trust/ca.crt
            - name: GIT_SSL_CAINFO
              value: /run/config/trust/ca.crt
            {{- end }}
          ports:
            - { name: health, containerPort: {{ .Values.worker.healthPort }} }
          readinessProbe:
            httpGet: { path: /health/ready, port: health }
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /health/live, port: health }
            periodSeconds: 10
          lifecycle:
            preStop:
              exec: { command: ["/bin/sh", "-c", "sleep 5"] }
          resources: {{ toYaml .Values.worker.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
            - { name: workspace, mountPath: /tmp/git-code-reviewer/workspaces }
            - { name: artifacts, mountPath: /var/lib/git-code-reviewer/artifacts }
            {{- include "git-code-reviewer.databaseVolumeMount" . | nindent 12 }}
            {{- if eq .Values.github.mode "app" }}
            - { name: github-app, mountPath: /run/secrets/github-app, readOnly: true }
            {{- end }}
            {{- if .Values.trustedCa.existingConfigMap }}
            - { name: trusted-ca, mountPath: /run/config/trust, readOnly: true }
            {{- end }}
      volumes:
        - name: tmp
          emptyDir: { sizeLimit: 128Mi }
        {{- include "git-code-reviewer.databaseVolume" . | nindent 8 }}
        - name: artifacts
          persistentVolumeClaim:
            claimName: {{ default (printf "%s-artifacts" (include "git-code-reviewer.fullname" .)) .Values.storage.artifacts.existingClaim }}
        {{- if eq .Values.github.mode "app" }}
        - name: github-app
          secret:
            secretName: {{ .Values.secrets.githubApp }}
            items:
              - { key: {{ .Values.github.privateKeyKey }}, path: private-key.pem }
        {{- end }}
        {{- if .Values.trustedCa.existingConfigMap }}
        - name: trusted-ca
          configMap:
            name: {{ .Values.trustedCa.existingConfigMap }}
            items:
              - { key: {{ .Values.trustedCa.key }}, path: ca.crt }
        {{- end }}
        - name: workspace
          {{- if eq .Values.worker.workspace.mode "emptyDir" }}
          emptyDir:
            sizeLimit: {{ .Values.worker.workspace.size }}
          {{- else }}
          ephemeral:
            volumeClaimTemplate:
              spec:
                accessModes: ["ReadWriteOnce"]
                storageClassName: {{ .Values.worker.workspace.storageClass | quote }}
                resources:
                  requests:
                    storage: {{ .Values.worker.workspace.size }}
          {{- end }}
