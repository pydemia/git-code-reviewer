apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "git-code-reviewer.fullname" . }}-server
  labels:
    {{- include "git-code-reviewer.labels" . | nindent 4 }}
    app.kubernetes.io/component: server
spec:
  replicas: {{ .Values.server.replicas }}
  selector:
    matchLabels:
      {{- include "git-code-reviewer.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: server
  template:
    metadata:
      labels:
        {{- include "git-code-reviewer.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: server
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/config-map.yaml") . | sha256sum }}
    spec:
      serviceAccountName: {{ include "git-code-reviewer.serviceAccountName" . }}
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile: { type: RuntimeDefault }
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets: {{ toYaml . | nindent 8 }}
      {{- end }}
      {{- if or .Values.postgresql.enabled (eq .Values.model.chat.mode "chatgpt-account") }}
      initContainers:
        {{- if .Values.postgresql.enabled }}
        {{- include "git-code-reviewer.migrationInitContainer" . | nindent 8 }}
        {{- end }}
        {{- if eq .Values.model.chat.mode "chatgpt-account" }}
        - name: bootstrap-chatgpt-account
          image: {{ include "git-code-reviewer.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["/bin/sh", "-ec"]
          args:
            - |
              umask 077
              target={{ printf "%s/auth.json" .Values.model.chat.account.home | quote }}
              marker={{ printf "%s/.bootstrap-revision" .Values.model.chat.account.home | quote }}
              revision={{ .Values.model.chat.account.bootstrapRevision | quote }}
              current_revision="$(cat "$marker" 2>/dev/null || true)"
              if [ ! -s "$target" ] || [ "$current_revision" != "$revision" ]; then
                temporary="$(mktemp "${target}.XXXXXX")"
                cp /run/secrets/chatgpt-account/auth.json "$temporary"
                chmod 600 "$temporary"
                mv "$temporary" "$target"
                marker_temporary="$(mktemp "${marker}.XXXXXX")"
                printf '%s\n' "$revision" > "$marker_temporary"
                mv "$marker_temporary" "$marker"
              fi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
            - { name: chatgpt-account-bootstrap, mountPath: /run/secrets/chatgpt-account, readOnly: true }
            - { name: chatgpt-account, mountPath: {{ .Values.model.chat.account.home | quote }} }
        {{- end }}
      {{- end }}
      containers:
        - name: server
          image: {{ include "git-code-reviewer.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["serve"]
          envFrom:
            - configMapRef: { name: {{ include "git-code-reviewer.fullname" . }} }
            {{- if ne .Values.auth.mode "development" }}
            - secretRef: { name: {{ .Values.secrets.auth }} }
            {{- end }}
          env:
            {{- include "git-code-reviewer.databaseEnv" . | nindent 12 }}
            {{- if .Values.credentialRegistry.enabled }}
            - name: CREDENTIAL_ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.credentialRegistry }}
                  key: {{ .Values.credentialRegistry.encryptionKeyKey }}
            {{- end }}
            {{- if eq .Values.github.mode "app" }}
            - name: GITHUB_APP_ID
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.githubApp }}
                  key: {{ .Values.github.appIdKey }}
            - name: GITHUB_PRIVATE_KEY_FILE
              value: /run/secrets/github-app/private-key.pem
            {{- end }}
            {{- if eq .Values.model.analysis.mode "openai-compatible" }}
            - name: MODEL_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.modelProvider }}
                  key: {{ .Values.model.analysis.apiKeyKey }}
            {{- end }}
            {{- if .Values.model.analysis.admin.enabled }}
            - name: MODEL_CREDENTIAL_ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.modelProvider }}
                  key: {{ .Values.model.analysis.admin.encryptionKeyKey }}
            {{- end }}
            {{- if eq .Values.model.chat.mode "openai-compatible" }}
            - name: CHAT_MODEL_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.chatModelProvider }}
                  key: {{ .Values.model.chat.apiKeyKey }}
            {{- end }}
            {{- if eq .Values.auth.mode "proxy" }}
            - name: PROXY_IDENTITY_PUBLIC_KEY_FILE
              value: /run/secrets/auth/proxy-public-key.pem
            {{- end }}
            {{- if .Values.trustedCa.existingConfigMap }}
            - name: NODE_EXTRA_CA_CERTS
              value: /run/config/trust/ca.crt
            {{- end }}
          ports:
            - { name: http, containerPort: {{ .Values.server.port }} }
          startupProbe:
            httpGet: { path: /health/startup, port: http }
            periodSeconds: 2
            failureThreshold: 30
          readinessProbe:
            httpGet: { path: /health/ready, port: http }
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /health/live, port: http }
            periodSeconds: 10
          resources: {{ toYaml .Values.server.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
            - { name: artifacts, mountPath: /var/lib/git-code-reviewer/artifacts, readOnly: true }
            {{- include "git-code-reviewer.databaseVolumeMount" . | nindent 12 }}
            {{- if eq .Values.github.mode "app" }}
            - { name: github-app, mountPath: /run/secrets/github-app, readOnly: true }
            {{- end }}
            {{- if eq .Values.auth.mode "proxy" }}
            - { name: auth-proxy, mountPath: /run/secrets/auth, readOnly: true }
            {{- end }}
            {{- if .Values.trustedCa.existingConfigMap }}
            - { name: trusted-ca, mountPath: /run/config/trust, readOnly: true }
            {{- end }}
            {{- if eq .Values.model.chat.mode "chatgpt-account" }}
            - { name: chatgpt-account, mountPath: {{ .Values.model.chat.account.home | quote }} }
            {{- end }}
      volumes:
        - name: tmp
          emptyDir: { sizeLimit: 128Mi }
        {{- include "git-code-reviewer.databaseVolume" . | nindent 8 }}
        - name: artifacts
          persistentVolumeClaim:
            claimName: {{ default (printf "%s-artifacts" (include "git-code-reviewer.fullname" .)) .Values.storage.artifacts.existingClaim }}
        {{- if eq .Values.github.mode "app" }}
        - name: github-app
          secret:
            secretName: {{ .Values.secrets.githubApp }}
            items:
              - { key: {{ .Values.github.privateKeyKey }}, path: private-key.pem }
        {{- end }}
        {{- if eq .Values.auth.mode "proxy" }}
        - name: auth-proxy
          secret:
            secretName: {{ .Values.secrets.auth }}
            items:
              - { key: {{ .Values.auth.proxyPublicKeyKey }}, path: proxy-public-key.pem }
        {{- end }}
        {{- if .Values.trustedCa.existingConfigMap }}
        - name: trusted-ca
          configMap:
            name: {{ .Values.trustedCa.existingConfigMap }}
            items:
              - { key: {{ .Values.trustedCa.key }}, path: ca.crt }
        {{- end }}
        {{- if eq .Values.model.chat.mode "chatgpt-account" }}
        - name: chatgpt-account-bootstrap
          secret:
            secretName: {{ .Values.secrets.chatgptAccount }}
            items:
              - { key: {{ .Values.model.chat.account.authFileKey }}, path: auth.json }
        - name: chatgpt-account
          persistentVolumeClaim:
            claimName: {{ include "git-code-reviewer.chatgptAccount.claimName" . }}
        {{- end }}
