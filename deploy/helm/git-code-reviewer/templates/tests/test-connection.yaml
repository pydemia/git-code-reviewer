apiVersion: v1
kind: Pod
metadata:
  name: "{{ include "git-code-reviewer.fullname" . }}-test-connection"
  labels:
    {{- include "git-code-reviewer.labels" . | nindent 4 }}
    app.kubernetes.io/component: test
  annotations:
    "helm.sh/hook": test
spec:
  restartPolicy: Never
  automountServiceAccountToken: false
  containers:
    - name: wget
      image: busybox:1.36
      command: ["wget"]
      args: ["--spider", "http://{{ include "git-code-reviewer.fullname" . }}/health/live"]
      securityContext:
        allowPrivilegeEscalation: false
        capabilities: { drop: ["ALL"] }
        runAsNonRoot: true
        runAsUser: 65534
        seccompProfile: { type: RuntimeDefault }
    {{- if .Values.cerbos.enabled }}
    - name: cerbos
      image: busybox:1.36
      command: ["wget"]
      args: ["--spider", "http://{{ include "git-code-reviewer.fullname" . }}-cerbos:{{ .Values.cerbos.port }}/_cerbos/health"]
      securityContext:
        allowPrivilegeEscalation: false
        capabilities: { drop: ["ALL"] }
        runAsNonRoot: true
        runAsUser: 65534
        seccompProfile: { type: RuntimeDefault }
    {{- end }}
