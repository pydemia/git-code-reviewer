<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f7f8fa" />
    <title>Git Code Reviewer</title>
  </head>
  <body>
    <!-- THESIS: 관리자가 새 PR 분석에 사용할 모델, effort와 병렬 처리 수를 한 화면에서 선택한다.
    OWN-WORLD: 기존 회색/teal Admin·Workspace와 Noto Sans KR, Lucide, dense panel을 유지한다.
    STORY: 관리자가 Skill version을 적용하고 reviewer는 고정된 분석 결과를 확인한다.
    FIRST VIEWPORT: 분석 모델 화면은 현재 설정, Account·Model·Effort와 병렬 수, 적용 범위, 저장 action 순서다. 기존 Worklist·Chat·diff·FNB와 gray/teal form은 유지한다.
    FORM: 기존 surface 확장, seed 적용 대상 아님. Comment 선택이 정확한 revision의 line과 inline 설명으로 이동한다.
    FINISH: unreviewed and undocumented is unfinished; this build ends with the finish review, the verdict, DESIGN.md, and every shipping raster carrying its provenance -->
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
